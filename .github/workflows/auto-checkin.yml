name: Claude Code Session Reset Scheduler

# Claude Code Session Reset Scheduler - Optimized for work periods
# Based on ADR-001, ADR-002 & ADR-003: Session reset scheduling with timing optimization and Q&A health check
# 05:19 UTC+8 -> 21:19 UTC (previous day) -> Reset at 10:19 UTC+8 (morning work period)
# 10:19 UTC+8 -> 02:19 UTC -> Reset at 15:19 UTC+8 (afternoon work period)
# 17:19 UTC+8 -> 09:19 UTC -> Reset at 22:19 UTC+8 (evening work period)
# 22:19 UTC+8 -> 14:19 UTC -> Reset at 03:19 UTC+8 next day (additional coverage)
on:
  schedule:
    # Execution times are in UTC
    - cron: '19 23,5,11 * * *'
  # Manual trigger for testing
  workflow_dispatch:

jobs:
  session-reset:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
      contents: read
      pull-requests: read    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
                
      - name: Execute Session Reset Logic
        uses: anthropics/claude-code-action@v1        
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: false
          prompt: |
            1+1=? # Answer in 1 char
